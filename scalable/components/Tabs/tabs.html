<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Tab Component</title>
    <link rel="stylesheet" href="tabs.css">
</head>
<body>
    
    <h1>Tabs Component</h1>
    
    <div class="tabs" id="tabs">
        <div class="tab-buttons">
            <button data-tab="1" class="active">Home</button>
            <button data-tab="2">Profile</button>
            <button data-tab="3">Settings</button>
        </div>

        <div class="tab-panels">
            <div data-panel="1" class="panel active">
                <h2>Home</h2>
                <p>Welcome to the home tab.</p>
            </div>

            <div data-panel="2" class="panel">
                <h2>Profile</h2>
                <p>This is your profile section.</p>
            </div>

            <div data-panel="3" class="panel">
                <h2>Settings</h2>
                <p>Adjust your preferences here.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import Tabs from "./tabs.js";

        new Tabs('#tabs');
    </script>
</body>
</html>
