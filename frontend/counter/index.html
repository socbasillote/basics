<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="app">
        
        <header>
            <h1>Counter Dashboard</h1>
            
            <button id="add-counter-btn">
                Add Counter
            </button>

            <button id="undo-btn">
                Undo
            </button>
        </header>

        <section class="stats">
            <div>Total: <span id="total-value">0</span></div>
            <div>Highest: <span id="highest-value">0</span></div>
            <div>Lowest: <span id="lowest-value">0</span></div>
        </section>
        

        <section id="counter-list" class="counter-list"></section>

        <section class="history-section">
            <h2>History</h2>
            <div id="history-list"></div>
        </section>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
