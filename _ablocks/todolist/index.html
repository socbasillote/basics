<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Todo List</h1>
    <div>
        <h3>Active Todo: </h3>
        <h3 id="countActive">0</h3>
    </div>
    
    <div id="app">
        <div>
            <input type="text" placeholder="Add to-do..." id="inputTodo">
            <button id="addBtn">Add</button>
        </div>

        <div>
            <button id="activeBtn">Active</button>
            <button id="completeBtn">Complete</button>
        </div>
        
        <ul id="lists"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
