<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    
    <main>
        <div id="app">
            <div class="appContent">
                <h1>Todo List</h1>
                <div>
                    <input type="text" placeholder="Add Todo..." class="todoInput" />
                    <button class="addTodoBtn">Add</button>
                </div>
                <div class="filterBtns">
                    <button class="allTodo">All</button>
                    <button class="activeTodo">Active</button>
                    <button class="completedTodo">Completed</button>
                </div>
                <ul id="lists"></ul>
            </div>
        </div>
    </main>
     <script type="module" src="app.js"></script>
</body>
</html>
