<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    
    <main>
        <div id="app">
            <div class="todoApp">
                <div class="headerApp">
                    <h1>Todo</h1>
                    <h3 class="todoCount">0</h3>
                </div>
    
                <div>
                    <input type="text" placeholder="What will you do today?" class="todoInput" />
                    <button class="addTodoBtn">Add</button>
                </div>

                <div class="filterBtn">
                    <button class="activeBtn">Active</button>
                    <button class="completeTodoBtn">Complete</button>
                </div>


                <div>
                    <ul id="lists"></ul>
                </div>
            </div>
        </div>
    </main>


    <script src="app.js"></script>
    
</body>
</html>
