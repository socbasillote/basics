<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="app">
        <div class="contentsUI">
            <div class="topContent">
                <h1>Todo App</h1>
                <h3 class="todoCount">0</h3>
            </div>
            
            <div class="todoContents">
                <div class="addTodoContents">
                    <input type="text" placeholder="Add to-do..." class="todoInput" />
                    <button class="todoAddBtn">Add</button>
                </div>
                <div>
                    <ul id="lists"></ul>
                </div>
            </div>
        </div>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
