<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <h1>Making a list</h1>

    <div id="componentlist">
        <form id="listForm">
            <input type="text" placeholder="Name" class="name" data-field="name"/>
            <input type="email" placeholder="Email" class="email" data-field="email" />
            <button class="submitBtn">Submit</button>
        </form>

        <div style="margin-top: 40px;">
            
            <ul id="list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
