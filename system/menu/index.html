<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>

    <h1>Menu</h1>

    <div class="select" id="select">
        <!-- Trigger -->
         <button class="select__trigger" data-select-trigger>
            <span data-select-label>Select an option</span>
         </button>

         <!-- Dropdown -->
          <ul class="select__menu" data-select-menu>
                <li class="select__option" data-value="apple">Apple</li>
                <li class="select__option" data-value="banana">Banana</li>
                <li class="select__option" data-value="orange">Orange</li>
          </ul>
    </div>

    <script src="index.js"></script>
</body>
</html>
