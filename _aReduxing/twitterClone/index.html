<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Dot Com</title>

    <link rel="stylesheet" href="style.css" >
    <script src="https://kit.fontawesome.com/9bd9631fcc.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav id="nav" class="nav">
        <h1>XDOTCOM</h1>
        <ul>
            <li class="loginBtn">Login</li>
        </ul>
    </nav>
    <main>
        <div class="centerContent">
            <section class="composer">
                <form id="postForm">
                    <textarea id="postInput" placeholder="Write a post..."></textarea>
                    <button type="submit">Post</button>
                </form>
            </section>   
            <section id="feed"></section>
        </div>

        <div class="modal" >
            <div class="modal-background">
                
                <div class="modal-content">
                    <div class="closeModal">X</div>
                    <h1>Modal</h1>
                    <form id="commentForm">
                        <textarea class="commentInput"></textarea>
                        <button>Submit</button>
                    </form>
                    
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
