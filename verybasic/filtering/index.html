<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Filtering</h1>

    <div class="filter" id="filterApp">
        <!-- Filter Buttons -->
         <div class="filter__controls">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
         </div>

         <!-- List -->
        <ul class="filter__list">
            <li class="item" data-status="active">Task 1</li>
            <li class="item" data-status="completed">Task 2</li>
            <li class="item" data-status="active">Task 3</li>
            <li class="item" data-status="completed">Task 4</li>
        </ul>
    </div>

    

     <script src="script.js"></script>
</body>
</html>
