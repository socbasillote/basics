<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Sync</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>

    <h1>Tab Sync</h1>

    <div class="tabs" id="tabs">
        <div class="tabs__nav">
            <button class="tab" data-tab="tab-1">Tab 1</button>
            <button class="tab" data-tab="tab-2">Tab 2</button>
            <button class="tab" data-tab="tab-3">Tab 3</button>
        </div>

        <div class="tabs__content">
            <div class="tab-panel" id="tab-1">Content 1</div>
            <div class="tab-panel" id="tab-2">Content 2</div>
            <div class="tab-panel" id="tab-3">Content 3</div>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
