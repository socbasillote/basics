<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <h1>Tabs</h1>

    <div class="tabs" id="tabs">
        <!-- Tab Button-->
         <div class="tabs__nav">
            <button class="tab active" data-tab="1">Tab 1</button>
            <button class="tab" data-tab="2">Tab 2</button>
            <button class="tab" data-tab="3">Tab 3</button>
            <button class="tab" data-tab="4">Tab 4</button>
         </div>

         <!-- Tab Content-->
          <div class="tabs__content">
            <div class="tab-panel active" data-content="1">Content 1</div>
            <div class="tab-panel" data-content="2">Content 2</div>
            <div class="tab-panel" data-content="3">Content 3</div>
            <div class="tab-panel" data-content="4">Content 4</div>
          </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
