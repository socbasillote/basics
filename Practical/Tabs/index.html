<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Example</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    
    <h1>Tabs</h1>

    <div class="tabs" id="tabs">

        <div class="btns">
            <button class="btn active" data-btn="1">Tab 1</button>
            <button class="btn" data-btn="2">Tab 2</button>
            <button class="btn" data-btn="3">Tab 3</button>
        </div>

        <div class="panels">
            <div class="panel open" data-panel="1">
                <h2>Panel 1</h2>
                <p>The only panel</p>
            </div>
            <div class="panel " data-panel="2">
                <h2>Panel 2</h2>
                <p>The only panel</p>
            </div>
            <div class="panel" data-panel="3">
                <h2>Panel 3</h2>
                <p>The only panel</p>
            </div>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
